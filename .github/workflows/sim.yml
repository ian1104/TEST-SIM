name: 쌍문 simulation

on:
  push:
  workflow_dispatch:

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rule tests
        run: pytest -q
      - name: Monte Carlo comparison
        run: python simulator.py --games 20000 --seed 20261017 --out results
      - name: Engine diagnostic audit
        run: python diagnose.py --games 5000 --seed 20261017
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ssangmun-simulation-results
          path: |
            results/
            diagnostic.json

name: 쌍문 simulation

on:
  push:
  workflow_dispatch:

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rule tests
        run: pytest -q
      - name: Monte Carlo comparison
        run: python simulator.py --games 20000 --seed 20261017 --out results
      - name: Engine diagnostic audit
        run: python diagnose.py --games 5000 --seed 20261017
      - name: Real engine debug games
        run: python simulator.py --games 1 --seed 20261017 --out debug_dummy --debug-games 50 --debug-min-score 5 --debug-out debug_logs
      - name: Analyze debug logs
        run: |
          python - <<'PY'
          import ast, glob, collections
          rows=[]
          for path in glob.glob('debug_logs/game_*.txt'):
              lines=open(path,encoding='utf-8').read().splitlines()
              result=next((x for x in lines if x.startswith('RESULT ')), None)
              if result: rows.append(ast.literal_eval(result[7:]))
          c=collections.Counter(x['method'] for x in rows)
          scores=collections.Counter(x['score'] for x in rows if x['method']!='draw')
          print('DEBUG_SUMMARY', {'games':len(rows),'methods':dict(c),'scores':dict(sorted(scores.items())),'avg_score':sum(x['score'] for x in rows if x['method']!='draw')/max(1,sum(x['method']!='draw' for x in rows))})
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ssangmun-simulation-results
          path: |
            results/
            diagnostic.json
            debug_logs/
